[package]
name = "music-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "music_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` serves files from disk to the webview. Cover art is loaded
# this way rather than over IPC: a list of five hundred rows would otherwise be
# five hundred round trips, each returning base64.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features = false drops the `any` driver and `json`, which this app
# never uses. `macros` stays on for query_as; `migrate` for sqlx::migrate!.
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
# std::fs::canonicalize returns `\\?\D:\Music` on Windows; dunce strips the
# extended-length prefix when it is safe to do so.
dunce = "1"
walkdir = "2.5.0"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
lofty = "0.25.0"
# Device output and mixing only -- deliberately no decoders.
#
# rodio's default features pull symphonia in as its decoder (`flac`, `mp3`,
# `mp4`, `vorbis`, `wav` each map to a `symphonia-*` feature). ffmpeg decodes
# everything this app plays, and the two were measured to be identical: equal
# to 0.1 dB against a known original on MP3, AAC and Vorbis, and bit-exact on
# FLAC and WAV. Keeping both meant two decode paths with different seek
# behaviour, no Opus on one of them, and filters available on only one.
#
# `playback` is cpal -- the device sink and the mixer, which is the part
# nothing else can replace. `dither` is kept deliberately: it is in the default
# set, it pulls no symphonia (`dither = ["noise"]` -> rand), and dropping it
# would silently change what reaches a device that wants fewer bits than f32.
rodio = { version = "0.22.2", default-features = false, features = [
    "playback",
    "dither",
] }
# Shuffle only. Was already present transitively; promoted to a direct dep.
rand = "0.10"
# Lock-free ring buffer between the ffmpeg reader thread and the audio
# callback thread, which must never block.
rtrb = "0.3"
# Channels and `select!` for the coordinator. Tauri already runs on tokio;
# this only makes the crate nameable.
tokio = { version = "1", features = ["sync", "macros", "time"] }
# Cover art normalisation. default-features = false drops around twenty codecs
# this app will never meet; the five kept are what tag pictures are actually
# encoded as. JPEG is the only *encoder* needed -- everything is stored as one.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
] }
# Content-addressing for cover art. A stable hash is the requirement, which
# rules out DefaultHasher -- it is explicitly not guaranteed across releases,
# and these hashes are filenames on disk.
sha2 = "0.10"
# One provider, one endpoint: SoundCloud's own search API.
#
# Every other network call this app makes goes through yt-dlp or ffmpeg, and
# that was worth trying first -- ffmpeg already fetches cover art over HTTPS.
# It cannot carry this: asked for a JSON body it reports "Output file does not
# contain any stream", because it is a media demuxer and this is not media.
# The webview cannot either -- api-v2 sends no `Access-Control-Allow-Origin`
# for any origin but its own, so `fetch` is blocked before it starts. Both
# measured rather than assumed.
#
# `native-tls` rather than `rustls-tls`: on Windows it is schannel, already
# present, with nothing to compile -- while rustls pulls aws-lc-rs, which
# wants NASM and cmake on this platform. The cost is that a Linux build needs
# OpenSSL headers, which is the right way round for an app whose installer is
# Windows-only today.
#
# default-features = false drops the charset, cookie and gzip machinery that
# one JSON GET has no use for.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "native-tls",
] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Cargo's defaults already give a real release build (`opt-level = 3`, no debug
# assertions). What follows is only size and speed tuning on top of that.
#
# Worth a note on scale: this trims a 19 MB binary, which sits next to a 110 MB
# ffmpeg sidecar. The win is real but small against the installer as a whole.
[profile.release]
# Whole-program optimisation across crate boundaries. The slower link is paid
# once per release build, never by a user.
lto = true
# One codegen unit lets LLVM see the whole crate at once. Costs parallelism
# during compilation, which matters far less than the shipped binary.
codegen-units = 1
# Debug symbols are useless in a build nobody can attach a debugger to, and
# they are most of what makes an unstripped Rust binary large.
strip = true
# Unwinding exists so a panic can be caught and recovered from. Nothing here
# does that: a panic in the audio thread or a command handler is a bug, not a
# condition to handle, so the unwind tables are dead weight.
#
# Deliberately not applied to `profile.test` -- the test harness needs unwinding
# to report which test panicked rather than aborting the whole run.
panic = "abort"

# Windows media transport controls: the flyout that appears on a media-key
# press, plus the lock-screen and volume-panel now-playing panel. Registering
# with it is also what makes the keys themselves reach this app at all.
#
# `default-features = false` because the defaults pull the D-Bus stack for the
# Linux backend, which is 40-odd crates that cannot build here anyway.
[target."cfg(windows)".dependencies]
souvlaki = { version = "0.8", default-features = false }

# Audio endpoint change notifications, for `device_watch`.
#
# The portable way to notice a device change is to poll cpal, which costs
# 3.2 ms and a CPU wakeup every second for the life of the process. WASAPI will
# simply tell us instead -- `IMMNotificationClient` is a callback the audio
# service invokes -- for no wakeups at all and no delay.
#
# Version pinned to what the tree already resolves through Tauri, so this
# builds nothing new. Two features only: the audio endpoint API and enough COM
# to create the enumerator. `windows::core::implement`, which builds the
# callback's vtable, needs no feature.
windows = { version = "0.61", features = ["Win32_Media_Audio", "Win32_System_Com"] }
# Named directly because `#[implement]` expands to `windows_core::` paths, which
# only resolve if the crate is a dependency by that name. Same version the
# `windows` facade re-exports, so it is the same crate either way.
windows-core = "0.61"
