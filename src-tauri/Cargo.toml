[package]
name = "music-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "music_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` serves files from disk to the webview. Cover art is loaded
# this way rather than over IPC: a list of five hundred rows would otherwise be
# five hundred round trips, each returning base64.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features = false drops the `any` driver and `json`, which this app
# never uses. `macros` stays on for query_as; `migrate` for sqlx::migrate!.
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
# std::fs::canonicalize returns `\\?\D:\Music` on Windows; dunce strips the
# extended-length prefix when it is safe to do so.
dunce = "1"
walkdir = "2.5.0"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
lofty = "0.25.0"
rodio = "0.22.2"
# Shuffle only. Was already present transitively; promoted to a direct dep.
rand = "0.10"
# Lock-free ring buffer between the ffmpeg reader thread and the audio
# callback thread, which must never block.
rtrb = "0.3"
# Channels and `select!` for the coordinator. Tauri already runs on tokio;
# this only makes the crate nameable.
tokio = { version = "1", features = ["sync", "macros", "time"] }
# Cover art normalisation. default-features = false drops around twenty codecs
# this app will never meet; the five kept are what tag pictures are actually
# encoded as. JPEG is the only *encoder* needed -- everything is stored as one.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
] }
# Content-addressing for cover art. A stable hash is the requirement, which
# rules out DefaultHasher -- it is explicitly not guaranteed across releases,
# and these hashes are filenames on disk.
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Cargo's defaults already give a real release build (`opt-level = 3`, no debug
# assertions). What follows is only size and speed tuning on top of that.
#
# Worth a note on scale: this trims a 19 MB binary, which sits next to a 110 MB
# ffmpeg sidecar. The win is real but small against the installer as a whole.
[profile.release]
# Whole-program optimisation across crate boundaries. The slower link is paid
# once per release build, never by a user.
lto = true
# One codegen unit lets LLVM see the whole crate at once. Costs parallelism
# during compilation, which matters far less than the shipped binary.
codegen-units = 1
# Debug symbols are useless in a build nobody can attach a debugger to, and
# they are most of what makes an unstripped Rust binary large.
strip = true
# Unwinding exists so a panic can be caught and recovered from. Nothing here
# does that: a panic in the audio thread or a command handler is a bug, not a
# condition to handle, so the unwind tables are dead weight.
#
# Deliberately not applied to `profile.test` -- the test harness needs unwinding
# to report which test panicked rather than aborting the whole run.
panic = "abort"
