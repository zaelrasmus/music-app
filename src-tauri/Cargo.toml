[package]
name = "music-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "music_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features = false drops the `any` driver and `json`, which this app
# never uses. `macros` stays on for query_as; `migrate` for sqlx::migrate!.
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
# std::fs::canonicalize returns `\\?\D:\Music` on Windows; dunce strips the
# extended-length prefix when it is safe to do so.
dunce = "1"
walkdir = "2.5.0"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
lofty = "0.25.0"
rodio = "0.22.2"
# Shuffle only. Was already present transitively; promoted to a direct dep.
rand = "0.10"
# Channels and `select!` for the coordinator. Tauri already runs on tokio;
# this only makes the crate nameable.
tokio = { version = "1", features = ["sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
